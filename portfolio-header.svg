<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="382" viewBox="0 0 1200 382" role="img" aria-labelledby="title desc"><title id="title">Agentic RAG Driver</title><desc id="desc">Better evidence for complex questions. Query expansion, document retrieval and reranking, based on DIVER.</desc><rect width="1200" height="382" rx="16" fill="#F6F8FA"/><rect width="1200" height="8" rx="4" fill="#285BA9"/><g font-family="Arial, Helvetica, sans-serif"><text x="52" y="58" font-size="15" letter-spacing="2.2" font-weight="700" fill="#285BA9">INFORMATION RETRIEVAL</text><text x="52" y="125" font-size="47" font-weight="700" letter-spacing="-1.5" fill="#16253B">Agentic RAG Driver</text><text x="52" y="180" font-size="29" fill="#30425A">Better evidence for complex questions.</text><text x="52" y="220" font-size="21" fill="#5D6B7E">Query expansion, document retrieval and reranking, based on DIVER.</text><rect x="52" y="277" width="350" height="58" rx="10" fill="white" stroke="#D8E1E8"/><circle cx="81" cy="306" r="13" fill="#E5EEFC"/><text x="81" y="311" font-size="13" fill="#285BA9" text-anchor="middle" font-weight="700">1</text><text x="106" y="312" font-size="19" fill="#27364B">Query expansion</text><path d="M407 306h9m-4-4 4 4-4 4" stroke="#285BA9" fill="none" stroke-width="1.8"/><rect x="422" y="277" width="350" height="58" rx="10" fill="white" stroke="#D8E1E8"/><circle cx="451" cy="306" r="13" fill="#E5EEFC"/><text x="451" y="311" font-size="13" fill="#285BA9" text-anchor="middle" font-weight="700">2</text><text x="476" y="312" font-size="19" fill="#27364B">Document retrieval</text><path d="M777 306h9m-4-4 4 4-4 4" stroke="#285BA9" fill="none" stroke-width="1.8"/><rect x="792" y="277" width="350" height="58" rx="10" fill="white" stroke="#D8E1E8"/><circle cx="821" cy="306" r="13" fill="#E5EEFC"/><text x="821" y="311" font-size="13" fill="#285BA9" text-anchor="middle" font-weight="700">3</text><text x="846" y="312" font-size="19" fill="#27364B">Reranking</text></g></svg>